<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Fondo degrade profundo -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181922" />
      <stop offset="50%" stop-color="#0f1015" />
      <stop offset="100%" stop-color="#070709" />
    </linearGradient>

    <!-- Borde sutil dorado -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#4a3f1a" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0.6" />
    </linearGradient>

    <!-- Resplandor central -->
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#d4af37" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Oro brillante (Brazo Izquierdo) -->
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4c2" />
      <stop offset="35%" stop-color="#f3d061" />
      <stop offset="70%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#9a7516" />
    </linearGradient>

    <!-- Oro sombra (Brazo Derecho para efecto facetado 3D) -->
    <linearGradient id="goldDark" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f3d061" />
      <stop offset="40%" stop-color="#d4af37" />
      <stop offset="80%" stop-color="#a67c1e" />
      <stop offset="100%" stop-color="#694e0e" />
    </linearGradient>

    <!-- Brillo del diamante central -->
    <linearGradient id="diamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#fff2b2" />
      <stop offset="100%" stop-color="#d4af37" />
    </linearGradient>

    <!-- Sombra elegante -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- Contenedor / Squircle con borde -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="6" />

  <!-- Resplandor ambiental de fondo -->
  <circle cx="256" cy="265" r="180" fill="url(#glowGrad)" />

  <!-- Grupo del Emblema V con sombra -->
  <g filter="url(#dropShadow)">
    <!-- Brazo izquierdo de la V (Facetado Iluminado) -->
    <path d="M 112 148 L 194 116 L 256 298 L 256 396 Z" fill="url(#goldLight)" />

    <!-- Brazo derecho de la V (Facetado Sombreado) -->
    <path d="M 400 148 L 318 116 L 256 298 L 256 396 Z" fill="url(#goldDark)" />

    <!-- Acento dinámico de movimiento: Diamante / Estrella de pulso en el centro -->
    <polygon points="256,150 282,185 256,220 230,185" fill="url(#diamondGrad)" />

    <!-- Detalle de reflejo en la punta inferior -->
    <polygon points="256,360 264,386 256,396 248,386" fill="#fff5cc" opacity="0.6" />
  </g>
</svg>
